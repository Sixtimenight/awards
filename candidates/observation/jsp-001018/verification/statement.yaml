id: STMT-jsp-001018-v1
status: active
supersedes: null
statement:
  text: "theorem erdos_1213 :\n    ∀ a K : ℕ, 1 ≤ a → 1 ≤ K → ∃ f : ℕ, ∀ (s : ℕ) (A : ℕ → ℕ),\n      0 < s →\n      A 0 = a →\n      (∀ ⦃i j : ℕ⦄, i < j → j < s → A i < A j) →\n      (∀ ⦃i : ℕ⦄, i + 1 < s → A (i + 1) - A i ≤ K) →\n      f < A (s - 1) →\n      Erdos1213.HasEqualIntervalSums A s"
  natural_language_source: "Erdos Problem 1213 (Hegyvari 1986): Let a, K >= 1. There exists a finite bound f(a, K) such that for every strictly increasing sequence of positive integers A with A(0) = a, bounded gap A(i+1) - A(i) <= K, and final value A(s-1) > f(a, K), there exist two distinct nonempty index intervals [u, v) and [x, y) with equal sum."
  definitions_reviewed:
    - name: "Erdos1213.intervalSum"
      from_library: false
      review: "Computes sum of sequence over half-open index interval [u, v) using Mathlib Finset.Ico."
    - name: "Erdos1213.HasEqualIntervalSums"
      from_library: false
      review: "Specifies existence of two distinct nonempty subsegments in [0, s) with equal sum."
    - name: "Erdos1213.explicitBound"
      from_library: false
      review: "Defines explicit constructive bound 4^K * a + 2 * K * (4^K)^2."
  library:
    name: "mathlib"
    commit: "db584cd6d46c92f209a44c0f1c829460d327499d"
    meets_minimum_safe_version: true
