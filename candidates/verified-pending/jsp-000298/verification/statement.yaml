id: STMT-jsp-000298-v1
status: active
supersedes: null
statement:
  text: "theorem exists_coloring_sieve (n s : ℕ) (P : Finset ℕ) (hn : 2 ≤ n) (hs : 1 ≤ s) (hP : ∀ p ∈ P, ¬ p ∣ n) :\n    ∃ c : ℕ → Fin (s + P.card + ((Erdos298.sieveRemainder n s P).card + s - 1) / s),\n      Erdos298.AvoidsMonoSubsetSum n (s + P.card + ((Erdos298.sieveRemainder n s P).card + s - 1) / s) c"
  natural_language_source: "Erdos Problem JSP-000298 (Erdos #360, Alon-Erdos 1996, Section 2): Let n >= 2, s >= 1. For any finite set P of elements not dividing n (e.g. primes p <= s with p ∤ n), there exists a coloring of {1, ..., n-1} with s + |P| + ceil(|R|/s) colors avoiding monochromatic subset sums to n, where R = {x in {1, ..., n-1} | (s+1)x < n and for all p in P, p ∤ x}. This combinatorial theorem does not require n <= s^3 and provides the foundation for the logarithmic improvement via prime sieving."
  definitions_reviewed:
    - name: "Erdos298.HasSubsetSum"
      from_library: false
      review: "Specifies existence of a subfinset T ⊆ S with sum equal to target n."
    - name: "Erdos298.AvoidsSubsetSum"
      from_library: false
      review: "Negation of HasSubsetSum, asserting that no subfinset of S has sum equal to n."
    - name: "Erdos298.AvoidsMonoSubsetSum"
      from_library: false
      review: "Asserts that every color class of coloring c on {1, ..., n-1} avoids subset sum n."
    - name: "Erdos298.intervalBlock"
      from_library: false
      review: "Defines the large interval blocks A_k = {x ∈ {1, ..., n-1} | n ≤ (k+1)*x ∧ k*x < n}."
    - name: "Erdos298.sieveRemainder"
      from_library: false
      review: "Defines the sieved remainder set R = {x ∈ {1, ..., n-1} | (s+1)*x < n ∧ ∀ p ∈ P, ¬ p ∣ x}."
    - name: "Erdos298.sieveBlock"
      from_library: false
      review: "Partitions remainder R into blocks of size at most s by enumerated index: C_j = ((R.toList.drop (j*s)).take s).toFinset."
    - name: "Erdos298.sievePrimes"
      from_library: false
      review: "Specializes the prime set P = {p ≤ s | p.Prime ∧ ¬ p ∣ n}."
    - name: "Erdos298.erdosBoundingSieve"
      from_library: false
      review: "Instantiates Mathlib's BoundingSieve with support Icc 1 ⌊(n-1)/(s+1)⌋ and unit density nu."
    - name: "Erdos298.unitDensity"
      from_library: false
      review: "Multiplicative density function nu(d) = 1/d on positive integers."
  library:
    name: "mathlib"
    commit: "db584cd6d46c92f209a44c0f1c829460d327499d"
    meets_minimum_safe_version: true
