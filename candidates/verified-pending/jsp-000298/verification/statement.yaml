id: STMT-jsp-000298-v1
status: active
supersedes: null
statement:
  text: "theorem erdos_298 :\n    (∀ n : ℕ, 2 ≤ n → ∃ (k : ℕ) (c : ℕ → Fin k), Erdos298.AvoidsMonochromaticSubsetSum n k c) ∧\n    (∀ (S : Finset ℕ) (m n : ℕ), (∀ x ∈ S, m ∣ x) → ¬ (m ∣ n) → Erdos298.AvoidsSubsetSum S n) ∧\n    (∀ (S : Finset ℕ) (n : ℕ), S.sum id < n → Erdos298.AvoidsSubsetSum S n)"
  natural_language_source: "Erdos Problem JSP-000298 (Alon-Erdos 1996): Let n >= 2. A coloring c of {1, ..., n-1} with k colors avoids monochromatic subset sum n if no color class contains a subset whose elements sum to n. For every n >= 2, there exists a finite coloring avoiding monochromatic subset sum n, and every color class formed by multiples of m (where m does not divide n) or with total sum < n avoids subset sum n."
  definitions_reviewed:
    - name: "Erdos298.HasSubsetSum"
      from_library: false
      review: "Specifies existence of a subfinset T ⊆ S with sum equal to target n."
    - name: "Erdos298.AvoidsSubsetSum"
      from_library: false
      review: "Negation of HasSubsetSum, asserting that no subfinset of S has sum equal to n."
    - name: "Erdos298.HasMonochromaticSubsetSum"
      from_library: false
      review: "Specifies existence of a monochromatic subset T ⊆ {1, ..., n-1} with element sum equal to n."
    - name: "Erdos298.AvoidsMonochromaticSubsetSum"
      from_library: false
      review: "Negation of HasMonochromaticSubsetSum, asserting that no color class admits a subset summing to n."
  library:
    name: "mathlib"
    commit: "db584cd6d46c92f209a44c0f1c829460d327499d"
    meets_minimum_safe_version: true
authorship:
