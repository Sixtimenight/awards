id: STMT-jsp-000298-v1
status: active
supersedes: null
statement:
  text: "theorem exists_coloring_of_le_cube (n s : ℕ) (hn : 2 ≤ n) (hs : 1 ≤ s) (hns : n ≤ s ^ 3) :\n    ∃ c : ℕ → Fin (2 * s), Erdos298.AvoidsMonoSubsetSum n (2 * s) c"
  natural_language_source: "Erdos Problem JSP-000298 (Erdos #360, Alon-Erdos 1996, Conlon-Fox-Pham 2021): Let n >= 2, s >= 1 with n <= s^3. There exists a coloring of {1, ..., n-1} with 2*s colors such that no monochromatic subset sums to n. This constructively establishes the elementary cubic-root chromatic upper bound f(n) <= 2*ceil(n^(1/3)) on subset-sum avoidance, alongside the non-trivial lower bound f(n) >= 2 for all n >= 3."
  definitions_reviewed:
    - name: "Erdos298.HasSubsetSum"
      from_library: false
      review: "Specifies existence of a subfinset T ⊆ S with sum equal to target n."
    - name: "Erdos298.AvoidsSubsetSum"
      from_library: false
      review: "Negation of HasSubsetSum, asserting that no subfinset of S has sum equal to n."
    - name: "Erdos298.AvoidsMonoSubsetSum"
      from_library: false
      review: "Asserts that every color class of coloring c on {1, ..., n-1} avoids subset sum n."
    - name: "Erdos298.intervalBlock"
      from_library: false
      review: "Defines the large interval blocks A_k = {x ∈ {1, ..., n-1} | n ≤ (k+1)*x ∧ k*x < n}."
    - name: "Erdos298.smallRemainder"
      from_library: false
      review: "Defines the small remainder set R = {x ∈ {1, ..., n-1} | (s+1)*x < n}."
    - name: "Erdos298.smallBlock"
      from_library: false
      review: "Partitions remainder R into s blocks C_j = R ∩ [j*s, (j+1)*s - 1]."
  library:
    name: "mathlib"
    commit: "db584cd6d46c92f209a44c0f1c829460d327499d"
    meets_minimum_safe_version: true
